services:
  mongo:
    image: mongo:7
    container_name: task-manager-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: task-manager-backend
    restart: unless-stopped
    depends_on:
      - mongo
    # Values are loaded from backend/.env (falls back to defaults in the app code).
    env_file:
      - ./backend/.env
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* vars are baked at build time, so the value from
        # frontend/.env is passed in as a build arg via the host shell.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    container_name: task-manager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Values are loaded from frontend/.env at runtime.
    env_file:
      - ./frontend/.env
    ports:
      - '3000:3000'

volumes:
  mongo-data:
