# Production stack for EC2.
# No local MongoDB container -- the backend connects to MongoDB Atlas via
# the MONGODB_URI value in backend/.env.
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml up --build -d

services:
  backend:
    build: ./backend
    container_name: task-manager-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
      args:
        # Baked at build time; must be the EC2 public URL in production.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    container_name: task-manager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    ports:
      - '3000:3000'
